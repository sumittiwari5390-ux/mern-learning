<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=.contai, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        display: flex;
        flex-direction: row;
        border: 5px solid black;
        background-color: beige;
        margin: 10px;
        padding: 2px;
    }
    #box1 {
        background-color: aqua;
        border: 5px solid brown;
        width: 200px;
        height: 200px;
        margin: 2px;
        padding: 10px;
        display: flex;
        flex-direction: column;
    }
    #box2 {
        background-color: yellow;
        border: 5px solid green;
        height: 200px;
        width: 200px;
        margin: 2px;
        padding: 10px;
    }
    p {
        border: 2px solid red;
    }
    img {
        height: 180px;
        width: 180px;
    }
    @media (max-width: 640px) {
        .container {
            flex-direction: column;
        }
    }
    
</style>
<body>
    <div class="container">

        <div id="box1">
            <p>text 1</p>
            <p>text 2</p>
        </div>

        <div id="box2">
            <img src="sup2.jpg">
        </div>

    </div>
</body>
</html>
