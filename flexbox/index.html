<style>
    .container {
        height: 500px;
        background-color: #f0f0f0;
        border: 10px solid black;
        display: flex;
        /* flex-direction: column; */
        /* flex-direction: row-reverse; */
        /* flex-direction: column-reverse; */
        flex-direction: row;

    }
